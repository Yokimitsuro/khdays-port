# The forms example's made-up character: three boxes on three of Roxas's bones, nothing of the game's (its files made
# by port/tests/mods_v2/character_forms/make_files.py). Two forms besides its own: `dual`, the game's dual-wield Roxas
# with the Zero Gear and three Ability Units (two made-up weapons); `guard`, chosen by the plugin's condition
# (character_forms.cpp).
[character]
format = 2
base = roxas
name = Twin
face = face.png

[model]
file = model/twin.gltf
skeleton = paired

[form dual]
base = roxas_dual
priority = 10
when = gear 230 and links 241 >= 3   # Zero Gear, Ability Unit
model = model/twin_dual.gltf

[form dual weapons]
ro_w13600 = weapons/right.gltf
ro_w14600 = weapons/left.gltf

[form guard]
priority = 5
when = plugin example.character-forms.guard
model = model/twin_dual.gltf

[form guard stats]
1 = defence 20
100 = defence 200
