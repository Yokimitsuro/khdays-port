# The example's parameter: KH Studio shows it (its Plugin window) and keeps the value chosen in
# parameters.values.ini; the plugin reads it as it starts (kh.parameters).
[guard]
type = flag
default = 0
label = Guard form
label es = Forma de guardia
help = Twin plays its guard form (more defence) when no Zero Gear with three Ability Units makes it dual-wield.
help es = Twin juega su forma de guardia (más defensa) cuando el Zero Gear con tres Ability Units no lo hace de doble arma.
