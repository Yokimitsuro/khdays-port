# The advanced example's mod: copy this folder to the game's mods/ with the built library in native/<platform>/.
id = example.advanced-native
name = Advanced native mod (example)
version = 1.0
author = khdays-port
description = Hooks the game's routines (the player's HP, enemies' hits, sounds), hears scene changes, calls a routine and reads a datum by name. Halves the damage the player takes.
sdk = 1
native.windows-x64 = native/windows-x64/advanced_native.dll
native.linux-x64 = native/linux-x64/advanced_native.so
native.linux-arm64 = native/linux-arm64/advanced_native.so
