# The Limit's parameters: KH Studio shows them (its Plugin window) and keeps the values chosen in
# parameters.values.ini; the plugin reads them as it starts (kh.parameters).
[spins]
type = integer
default = 8
min = 1
max = 30
label = Spins
label es = Giros
label fr = Tours
help = How many times the Limit spins.
help es = Cuántas veces gira el Limit.

[damage]
type = number
default = 1.25
min = 0.1
max = 10
label = Spin damage
label es = Daño por giro
help = Each spin's damage: the character's strength times this.
help es = El daño de cada giro: la fuerza del personaje por esto.

[reach]
type = number
default = 2.5
min = 0.5
max = 20
label = Reach
label es = Alcance
help = How far from the character a spin hits, in the field's units.
help es = Hasta dónde golpea un giro desde el personaje, en unidades del campo.

[status]
type = choice
choices = none, burn, freeze, jolt, toss
default = none
label = Status
label es = Estado
help = The status each hit may give (its chance below).
help es = El estado que puede dar cada golpe (su probabilidad abajo).

[chance]
type = integer
default = 30
min = 0
max = 100
label = Status chance
label es = Probabilidad del estado
