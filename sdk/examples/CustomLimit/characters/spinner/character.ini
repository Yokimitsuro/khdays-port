# The Limit example's made-up character: three boxes on a skeleton of its own (pelvis, spine, head), with its own
# clips, nothing of the game's (made by ../../make_files.py). Its plugin (custom_limit.cpp) gives it its Limit.
[character]
format = 1
base = roxas
name = Spinner
name es = Peonza
name fr = Toupie
name de = Kreisel
name it = Trottola
weapon = Stick
weapon es = Palo
face = face.png

[model]
file = model/spinner.gltf
skeleton = own

[actions]
fallback = clips/idle.gltf
limit_start = clips/limit_start.gltf
limit_spin = clips/limit_spin.gltf
limit_end = clips/limit_end.gltf
