# The Limit example's mod: copy this folder to the game's mods/ with the built library in native/<platform>/.
id = example.custom-limit
name = Custom Limit (example)
version = 1.0
author = khdays-port
description = A made-up character (Spinner, on Roxas's code, its own skeleton and clips) whose Limit is the plugin's own: a spin whose hits go through the game's hit routine.
kind = gameplay
sdk = 1
native.windows-x64 = native/windows-x64/custom_limit.dll
native.linux-x64 = native/linux-x64/custom_limit.so
native.linux-arm64 = native/linux-arm64/custom_limit.so
