# The Hello World plugin's mod: copy this folder to the game's mods/ with the built library in native/<platform>/.
id = example.hello-world
name = Hello World (native)
version = 1.0
author = khdays-port
description = The KH Mod SDK's first example: logs a line when the game starts and another when it ends.
sdk = 1
native.windows-x64 = native/windows-x64/hello_world.dll
native.linux-x64 = native/linux-x64/hello_world.so
native.linux-arm64 = native/linux-arm64/hello_world.so
