# Kingdom Hearts 358/2 Days, native port: the settings the installer gives a new install.
# The port rewrites this file when its settings menu closes; you may edit it.
version = 1
# language: system (the system's, if the game has it), en, fr, de, it or es
language = system
# log: on writes the session log to saves/logs (F12 marks a moment in it)
log = on
preset = kh2

[keyboard]
up = W
down = S
left = A
right = D
a = Mouse Left
b = Space
x = C
y = Mouse Right
l = Left Shift, Left
r = Mouse Middle, Right
start = M, Return
select = N
lock_on =
target_next =
target_prev =

[keyboard.field]
menu_up = Mouse Wheel Up
menu_down = Mouse Wheel Down
menu_left = Q
menu_right = E

[gamepad]
up = dpup
down = dpdown
left = dpleft
right = dpright
a = south
b = east
x = north
y = west
l = leftshoulder
r = rightstick
start = start
select = back
lock_on = rightshoulder
target_next = righttrigger
target_prev =
open_settings = guide, leftstick

[gamepad.field]
menu_up = dpup
menu_down = dpdown
menu_left = dpleft
menu_right = dpright

[sticks]
left = dpad
right = camera
left_dead_zone = 30
right_dead_zone = 30
left_hysteresis = 5
right_hysteresis = 5

[enhancements]
analog_camera = on
camera_speed = 200
camera_invert_x = off
camera_invert_y = off
separate_lock_on = on
dpad_command_menu = on
analog_movement = on
run_threshold = 75
walk_speed = 50
chase_free = off

[video]
# display: window, borderless (a window without borders over the whole screen) or fullscreen
display = window
# internal_resolution: window (the window's size, the default) or a whole multiple of the DS's
# picture: the settings offer 2 to 16; 1, the DS's own, only for comparing with the DS
internal_resolution = window
# antialiasing: off, 2x, 3x or 4x -- the picture made that many times larger and shrunk,
# the 3D's edges smooth (2x is four times the work, 4x sixteen); off, as the internal
# resolution already draws the 3D larger
antialiasing = off
# screens: two (the DS's, one above the other) or one (one picture)
screens = one
# hud_size: 1 to 8, the HUD's size on one screen (4 the default)
hud_size = 1
# aspect: 4:3 (the DS's), 16:9, 16:10, or window
aspect = window
# scaling: sharp (the DS's pixels) or smooth
scaling = smooth
texture_smoothing = on
hd_graphics = on
dump_graphics = off
# movies: hd (the HD collection's videos where data/cutscenes/cinematics has them,
#         else pc), pc (full colour) or ds (the DS's 15-bit colour, dithered)
movies = hd
# subtitles: on or off, the movies' subtitles (a new game asks)
subtitles = on
# picture_pace: smooth (the 3D at the monitor's rate, up to a logic frame behind) or ds
picture_pace = ds
# show_fps: the pictures and the game's frames a second, in a corner
show_fps = off
# backend: the graphics API -- auto (SDL's choice), direct3d12 or vulkan
backend = auto

[sound]
# volume, music, effects, voices, movies: 0 to 100
volume = 100
music = 100
effects = 100
voices = 100
movies = 100
# ds_exact: on gives the DS's own output (32,728 Hz, 10 bits); off, the PC's
ds_exact = off

[network]
# nickname: the name Mission Mode's multiplayer shows the others, up to 10 characters;
# nothing after = gives an automatic one ("Player" and four digits)
nickname =
# online: on also finds and offers rooms through the server, besides this PC and the
# local network; server: its address (host or host:port, the port 35821 if none)
online = on
server = 212.227.76.27
# show_ping: in a session, the round trip to each other player, in a corner
show_ping = off
# check_updates: once a day, ask GitHub whether a newer release of the port is out, and
# say so on the title screen (nothing about you is sent)
check_updates = on
