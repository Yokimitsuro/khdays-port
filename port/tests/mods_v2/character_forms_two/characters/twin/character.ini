# A made-up character with two forms for the port's tests (make_files.py): nothing of the game.
[character]
format = 2
base = roxas
name = Twin
face = face.png

[model]
file = model/twin.gltf
skeleton = paired

[stats]
1 = hp 40 strength 9
100 = hp 400 strength 90

[form dual]
base = roxas_dual
priority = 10
when = gear 230 and links 241 >= 3   # Zero Gear, Ability Unit
model = model/twin_dual.gltf
skeleton = paired

[form dual weapons]
ro_w13600 = weapons/right.gltf
ro_w14600 = weapons/left.gltf
